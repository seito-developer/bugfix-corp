<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" href="/images/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP&family=Oxygen+Mono&display=swap" rel="stylesheet" />
    <!-- <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&&display=swap" rel="stylesheet"> -->
    <link rel="stylesheet" href="/assets/styles/siid-lp/main.scss">
    <script src="https://kit.fontawesome.com/c1405253c9.js" crossorigin="anonymous"></script>
    <title><%= title %></title>
    <meta name="description" content="<%= disc %>">
    <!-- 広告専用LPのため検索結果には出さない（/siid/ との重複評価を回避） -->
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://bug-fix.org/siid-lp/">

    <meta property="og:title" content="<%= title %>">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bug-fix.org/siid-lp/">
    <meta property="og:image" content="https://bug-fix.org/images/ogp-siid.png">

    <!-- オプション -->
    <meta property="og:description" content="<%= disc %>">
    <meta property="og:site_name" content="<%= common.siteName %>">
    <meta property="og:locale" content="ja_JP">

    <!-- Twitterカード -->
    <meta name="twitter:card" content="summary_large_image"> <!-- 画像を大きく表示したい場合 -->
    <meta name="twitter:site" content="@seito_horiguchi"> <!-- サイトのTwitterアカウント -->
    <meta name="twitter:title" content="<%= title %>">
    <meta name="twitter:description" content="<%= disc %>">
    <meta name="twitter:image" content="https://bug-fix.org/images/ogp-siid.png">
    <meta name="twitter:image:alt" content="<%= title %>">

    <%- include('../modules/meta/_analytics.html') %>
</head>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-58D75LLL"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
